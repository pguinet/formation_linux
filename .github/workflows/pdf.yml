# Génération et vérification des PDF : mêmes commandes qu'en local.
name: PDF

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  # Lancement manuel (onglet Actions, « Run workflow ») : avec un tag,
  # crée aussi le tag et la release sur le commit choisi, sans terminal.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à créer (ex. v2026.3), vide pour les PDF seuls"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: ./pdf/build check

      - name: PDF
        run: ./pdf/build pdf

      - name: Tests
        run: ./pdf/build test

      - name: Publier les PDF (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: pdf-${{ github.sha }}
          path: build/pdf/*.pdf
          if-no-files-found: error

      - name: Publier le diagnostic (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-${{ github.sha }}
          path: build/pdf/debug/
          if-no-files-found: ignore

  release:
    needs: pdf
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pdf-${{ github.sha }}
          path: pdf

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        # --target : en lancement manuel, le tag n'existe pas encore ;
        # gh le crée sur le commit qui a produit les PDF.
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "Tag invalide : $TAG (doit commencer par v)"; exit 1 ;;
          esac
          gh release create "$TAG" pdf/*.pdf \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "Formation Linux $TAG" \
            --generate-notes
