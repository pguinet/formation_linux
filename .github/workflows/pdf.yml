# Génération et vérification des PDF : mêmes commandes qu'en local.
name: PDF

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: ./pdf/build check

      - name: PDF
        run: ./pdf/build pdf

      - name: Tests
        run: ./pdf/build test

      - name: Publier les PDF (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: pdf-${{ github.sha }}
          path: build/pdf/*.pdf
          if-no-files-found: error

      - name: Publier le diagnostic (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-${{ github.sha }}
          path: build/pdf/debug/
          if-no-files-found: ignore

  release:
    needs: pdf
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pdf-${{ github.sha }}
          path: pdf

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" pdf/*.pdf
          --repo "${{ github.repository }}"
          --title "Formation Linux ${{ github.ref_name }}"
          --generate-notes
